<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Storm Nova Games</title>
  <meta name="description" content="Storm Nova Labs 的小游戏合集">
  <style>
    :root {
      --bg: #0f1720;
      --card: #18232f;
      --card-hover: #1f2e3d;
      --text: #eef2f6;
      --muted: #93a4b5;
      --accent: #f2c14e;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #1a2a3a, var(--bg) 60%);
      color: var(--text);
      font-family: system-ui, "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    main { max-width: 960px; margin: 0 auto; padding: 48px 16px; }
    h1 { margin: 0 0 6px; font-size: 32px; letter-spacing: 1px; }
    .sub { margin: 0 0 32px; color: var(--muted); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 16px;
    }
    a.game {
      display: block;
      padding: 20px;
      border-radius: 14px;
      background: var(--card);
      border: 1px solid var(--border);
      color: inherit;
      text-decoration: none;
      transition: transform 0.15s, background 0.15s, border-color 0.15s;
    }
    a.game:hover { transform: translateY(-3px); background: var(--card-hover); border-color: var(--accent); }
    .icon { font-size: 36px; line-height: 1; }
    .name { margin: 12px 0 4px; font-size: 19px; font-weight: bold; }
    .desc { margin: 0; color: var(--muted); font-size: 14px; }
    footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Storm Nova Games</h1>
    <p class="sub">点开就能玩的小游戏，不用下载</p>

    <div class="grid">
      <a class="game" href="/cards-cursor/">
        <div class="icon">🃏</div>
        <div class="name">斗地主</div>
        <p class="desc">经典三人斗地主，可以开房间和朋友一起玩</p>
      </a>
      <a class="game" href="/majiang/">
        <div class="icon">🀄</div>
        <div class="name">简单麻将</div>
        <p class="desc">你和三个电脑对手，摸打、碰、自摸、七对</p>
      </a>
      <a class="game" href="https://kart.stormnovalabs.com/">
        <div class="icon">🏎️</div>
        <div class="name">卡丁狂飙</div>
        <p class="desc">卡丁车竞速</p>
      </a>
      <a class="game" href="https://rts.stormnovalabs.com/">
        <div class="icon">⚔️</div>
        <div class="name">钢铁前线</div>
        <p class="desc">即时战略</p>
      </a>
    </div>

    <footer>© Storm Nova Labs · <a href="https://stormnovalabs.com/">stormnovalabs.com</a></footer>
  </main>
</body>
</html>
